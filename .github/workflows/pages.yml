name: Сайт — тестовый стенд (GitHub Pages)

# Публикует папку site/ на GitHub Pages при изменениях в main.
# Это стенд для просмотра: страницы закрыты от индексации (noindex + robots.txt).
# Боевой сайт — отдельно, ветка production, только после одобрения владельца.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "quests/**/quest.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Не прерываем идущую публикацию новым пушем — дождёмся её.
concurrency:
  group: pages
  cancel-in-progress: false

# ВАЖНО: загрузка и публикация — в РАЗНЫХ job (build → deploy).
# В одном job deploy-pages иногда не видит только что загруженный артефакт
# («No artifacts named github-pages», actions/deploy-pages#451),
# а re-run такого запуска ломается окончательно (два артефакта github-pages).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Плеер квеста (site/play/<id>/) читает quest.json из своей папки.
      # Источник истины — quests/<id>/quest.json, в site/ его не храним (см. .gitignore).
      - name: Данные квестов для плеера
        run: |
          for d in site/play/*/; do
            id=$(basename "$d")
            if [ -f "quests/$id/quest.json" ]; then
              cp "quests/$id/quest.json" "$d/quest.json"
              echo "quest.json → site/play/$id/"
            else
              echo "::warning::нет quests/$id/quest.json — плеер $id не загрузится"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
