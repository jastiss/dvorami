name: Сайт — тестовый стенд (GitHub Pages)

# Публикует папку site/ на GitHub Pages при изменениях в main.
# Это стенд для просмотра: страницы закрыты от индексации (noindex + robots.txt).
# Боевой сайт — отдельно, ветка production, только после одобрения владельца.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
