name: Сайт — тестовый стенд (GitHub Pages)

# Публикует папку site/ на GitHub Pages при изменениях в main.
# Это стенд для просмотра: страницы закрыты от индексации (noindex + robots.txt).
# Боевой сайт — отдельно, ветка production, только после одобрения владельца.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "quests/**/quest.json"
      - "quests/**/codes.json"
      - "scripts/codes.py"
      - "scripts/player_check.js"
      - "scripts/answer_check.js"
      - "scripts/answer_match.py"
      - "scripts/site_check.js"
      - "platform/site/og-manifest.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Не прерываем идущую публикацию новым пушем — дождёмся её.
concurrency:
  group: pages
  cancel-in-progress: false

# ВАЖНО: загрузка и публикация — в РАЗНЫХ job (build → deploy).
# В одном job deploy-pages иногда не видит только что загруженный артефакт
# («No artifacts named github-pages», actions/deploy-pages#451),
# а re-run такого запуска ломается окончательно (два артефакта github-pages).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # H-104: быстрая сверка без браузера первым шагом (секунды, только node) — цифры витрины = quest.json,
      # OG-картинки = данным дела (site_check.js --sync). Красная — дальше не идём: ни Chromium, ни шифрования, ни выкладки.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Быстрая сверка витрины со сценарием и OG (site_check --sync)
        run: node scripts/site_check.js --sync
      - uses: actions/configure-pages@v5
      # Плеер квеста (site/play/<id>/) читает зашифрованное дело quest.locked.json из своей папки (docs/codes.md).
      # Источник истины — quests/<id>/quest.json; в site/ открытый quest.json не попадает никогда.
      # Ключ содержимого — новый случайный при каждой сборке; открыть его можно мастер-кодом (секрет QUEST_MASTER_CODE)
      # и выпущенными кодами из quests/<id>/codes.json. Нет секрета — сборка не падает: экран кода есть, коды не подходят.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Пакет для шифрования (cryptography)
        run: python -m pip install --quiet cryptography
      # T-63 (H-10): прохождение дела целиком в настоящем плеере (3 ширины × 2 темы, экран кода, тестовые коды на лету).
      # Красный тест — сборка падает, стенд не обновляется (остаётся прежняя рабочая версия).
      # Идёт ДО шифрования: проверяет исходный site/ и quests/<id>/quest.json, мастер-код ему не нужен.
      - name: Playwright + Chromium для автотеста плеера
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Автотест плеера (player_check) — красный блокирует выкладку
        run: |
          for d in site/play/*/; do
            id=$(basename "$d")
            if [ -f "quests/$id/quest.json" ]; then node scripts/player_check.js --quest="$id"; fi
          done
      # Мастер-код ОДИН на все дела (владелец 27.11): каждое дело с quests/<id>/quest.json и страницей site/play/<id>/
      # шифруется так, что его открывает тот же секрет QUEST_MASTER_CODE. Новое дело ничего не настраивает — достаточно двух папок.
      - name: Дела для плеера — зашифрованы кодом доступа (мастер-код — общий)
        env:
          QUEST_MASTER_CODE: ${{ secrets.QUEST_MASTER_CODE }}
        run: |
          for d in site/play/*/; do
            id=$(basename "$d")
            rm -f "$d/quest.json"
            if [ -f "quests/$id/quest.json" ]; then
              python scripts/codes.py seal --quest "$id" --out "$d/quest.locked.json"
            else
              echo "::warning::нет quests/$id/quest.json — плеер $id не загрузится"
            fi
          done
          for f in quests/*/quest.json; do
            id=$(basename "$(dirname "$f")")
            [ -d "site/play/$id" ] || echo "::notice::дело $id: есть quest.json, нет страницы site/play/$id/ — на стенде его не пройти (скопируйте site/play/zilart/index.html и theme.css)"
          done
      - name: Проверка — мастер-код открывает каждое дело стенда
        env:
          QUEST_MASTER_CODE: ${{ secrets.QUEST_MASTER_CODE }}
        run: python scripts/codes.py verify site
      - name: Проверка — открытого текста дел в сайте нет
        run: python scripts/codes.py leakcheck site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
