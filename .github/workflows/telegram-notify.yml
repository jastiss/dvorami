name: Telegram — отчёт

on:
  push:
    branches: [main]
    paths: ["reports/**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Отправить отчёт
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/telegram_notify.py ${{ github.event_name == 'workflow_dispatch' && 'latest' || 'changed' }}
