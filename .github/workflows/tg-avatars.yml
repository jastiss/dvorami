name: Telegram — аватарки канала и бота
# Ручной запуск. Канал — avatar-channel.png, бот — avatar-bot.png (docs/marketing/channel/).
on:
  workflow_dispatch:
jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          PLAYER_BOT_TOKEN: ${{ secrets.PLAYER_BOT_TOKEN }}
          CHANNEL_CHAT_ID: ${{ secrets.CHANNEL_CHAT_ID }}
        run: python3 scripts/tg_set_avatars.py
