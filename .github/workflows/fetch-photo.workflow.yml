# ПРЕДЛОЖЕНИЕ, НЕ ВКЛЮЧЕНО. Арт-директор, 24.11.2026.
# Файл лежит в docs/ и сам не запускается. Чтобы включить: решение владельца (A-32 разрешал скачивание
# только из fal) → перенести в .github/workflows/fetch-photo.yml → завести переменную репозитория MEDIA_UA
# (Settings → Variables), например «dvorami-media/1.0 (<адрес сайта или почта для связи>)»: Wikimedia
# отвечает 429 «robot policy» клиентам без контакта в User-Agent.
# Зачем отдельный workflow: fetch-media.yml пропускает только *.fal.media и кладёт файл как есть;
# здесь — только upload.wikimedia.org, только в site/assets/photo|art, и сразу сжатие (оригинал 5–10 МБ в git не попадает).
# Запуск: gh api -X POST repos/jastiss/dvorami/actions/workflows/fetch-photo.yml/dispatches -f ref=main \
#   -f 'inputs[url]=<прямая ссылка upload.wikimedia.org>' -f 'inputs[path]=site/assets/photo/zilart/pergola.jpg' -f 'inputs[fit]=1200x900'
name: Медиа — скачать фото с Wikimedia Commons
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Прямая ссылка на файл (только upload.wikimedia.org)"
        required: true
      path:
        description: "Куда положить: site/assets/photo/<дело>/<слот>.jpg или site/assets/art/<дело>/<имя>.jpg"
        required: true
      fit:
        description: "1200x900 — обрезать по центру до 4:3 (фото мест); пусто — только уменьшить до 1200 px по ширине (репродукции)"
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-media
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Проверить, скачать, сжать
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.path }}
          FIT: ${{ inputs.fit }}
          MEDIA_UA: ${{ vars.MEDIA_UA }}
        run: |
          python3 - <<'PY'
          import os, re, sys, subprocess, urllib.parse, urllib.request, pathlib
          url, dest, fit, ua = (os.environ[k].strip() for k in ("URL", "DEST", "FIT", "MEDIA_UA"))
          u = urllib.parse.urlparse(url)
          if u.scheme != "https" or u.hostname != "upload.wikimedia.org":
              sys.exit(f"Разрешены только https-ссылки upload.wikimedia.org, получено: {u.hostname}")
          p = pathlib.PurePosixPath(dest)
          if p.is_absolute() or ".." in p.parts or not re.fullmatch(r"site/assets/(photo|art)/[a-z0-9-]+/[a-z0-9-]+\.jpg", dest):
              sys.exit("Путь: site/assets/photo/<дело>/<слот>.jpg или site/assets/art/<дело>/<имя>.jpg")
          if fit and not re.fullmatch(r"\d{3,4}x\d{3,4}", fit):
              sys.exit("fit — вида 1200x900")
          if not ua:
              sys.exit("Не задана переменная репозитория MEDIA_UA (User-Agent с контактом)")
          data = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=120).read()
          if len(data) > 40 * 1024 * 1024:
              sys.exit("Файл больше 40 МБ")
          pathlib.Path("/tmp/src").write_bytes(data)
          out = pathlib.Path(dest); out.parent.mkdir(parents=True, exist_ok=True)
          geom = ["-resize", fit + "^", "-gravity", "center", "-extent", fit] if fit else ["-resize", "1200x1600>"]
          subprocess.run(["convert", "/tmp/src[0]", "-auto-orient", *geom, "-strip", "-interlace", "Plane",
                          "-define", "jpeg:extent=250kb", str(out)], check=True)
          print(f"{len(data)} байт → {dest}: {out.stat().st_size} байт")
          PY
      - name: Сохранить в репозиторий
        env:
          DEST: ${{ inputs.path }}
        run: |
          git config user.name "dvorami-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DEST"
          git diff --cached --quiet && exit 0
          git commit -m "Фото с Commons: $DEST"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
