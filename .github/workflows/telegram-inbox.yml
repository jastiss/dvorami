name: Telegram — входящие

# Каждые 30 минут с 08:00 до 23:30 по Москве + в 06:00, перед утренней итерацией.
# Команда также запускает этот workflow сама в начале каждой итерации, чтобы не пропустить свежие указания.
# Частота подобрана под бесплатные минуты GitHub Actions (~1000 мин/мес на входящие).
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "*/30 5-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Забрать сообщения
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py
      - name: Сохранить в репозиторий
        run: |
          if [ -z "$(git status --porcelain -- DIRECTIVES.md .telegram/offset)" ]; then exit 0; fi
          git config user.name "dvorami-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DIRECTIVES.md .telegram/offset
          git commit -m "Telegram: указания владельца"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Запустить команду, если просили /run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_FIRE_URL: ${{ secrets.CLAUDE_FIRE_URL }}
          CLAUDE_FIRE_TOKEN: ${{ secrets.CLAUDE_FIRE_TOKEN }}
        run: python3 scripts/fire_team.py
