name: Игровой бот — отзывы

# Игровой бот @dvorami_bot (scripts/feedback_bot.py): длинный опрос getUpdates в одном задании ~5 ч 40 мин.
# Ответ игроку — за секунды; на пересменке заданий — до ~1 мин (следующее задание уже ждёт в очереди).
# Cron раз в час только держит очередь полной: concurrency не даёт запустить второй опрос (иначе 409),
# лишние ожидающие запуски GitHub сам отменяет — «cancelled» в списке запусков это норма.
# Состояние сохраняется в main раз в COMMIT_MIN минут (если менялось) и при выходе — scripts/feedback_bot_commit.sh.
# Пока секрета PLAYER_BOT_TOKEN нет — скрипт сразу выходит, ничего не коммитит.
# Свой токен и свой offset (.telegram/feedback-offset): с «Telegram — входящие» не пересекается.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feedback-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # предел GitHub — 360; опрос заканчивается сам через POLL_MIN
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # свежий main на момент старта, а не коммит, при котором запуск встал в очередь
      - name: Отвечать игрокам
        env:
          PLAYER_BOT_TOKEN: ${{ secrets.PLAYER_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_MIN: "340"
          COMMIT_MIN: "30"
        run: python3 scripts/feedback_bot.py
      - name: Сохранить в репозиторий
        if: always()
        run: bash scripts/feedback_bot_commit.sh
