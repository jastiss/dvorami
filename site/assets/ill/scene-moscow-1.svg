<title id="t">Двор-колодец за аркой</title><desc id="d">Вид из тёмной арки в старый московский двор-колодец вечером: стены с десятками тёплых окон, над крышами полоска сумеречного неба, во дворе дерево, фонарь над подъездом, качели с ребёнком и кошка на брусчатке; под аркой идут взрослый и ребёнок.</desc>
