<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Сцена: принцесса и маски</title><desc id="d">Театральная сцена с бархатными кулисами и фестонами: на фоне раскрытого веера-задника стоит золотая принцесса в короне, руки спрятаны в широких рукавах; по сторонам парят две маски итальянской комедии.</desc><defs><linearGradient id="velvet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A0812"/><stop offset=".25" stop-color="#7A1728"/><stop offset=".5" stop-color="#4A0C18"/><stop offset=".75" stop-color="#8A1D30"/><stop offset="1" stop-color="#3A0812"/></linearGradient>
