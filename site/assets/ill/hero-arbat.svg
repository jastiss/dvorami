<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Сцена: принцесса и маски</title><desc id="d">Театральная сцена с бархатными кулисами и фестонами: в луче прожектора стоит золотая принцесса в короне, над сценой парят три маски итальянской комедии.</desc><defs><linearGradient id="velvet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5E0A18"/><stop offset=".25" stop-color="#C4182F"/><stop offset=".5" stop-color="#7A0E1F"/><stop offset=".75" stop-color="#D62038"/><stop offset="1" stop-color="#5E0A18"/></linearGradient>
