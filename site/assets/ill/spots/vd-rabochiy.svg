<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Открытка: «Рабочий и колхозница»</title><desc id="d">Видовая открытка в тонированной печати: на фоне бирюзового неба стальные фигуры рабочего и колхозницы поднимают молот и серп, за ними развевается шарф; в углу марка и штемпель.</desc><defs><linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E6FB8"/><stop offset=".55" stop-color="#5FB3C2"/><stop offset="1" stop-color="#F3E3B6"/></linearGradient>
