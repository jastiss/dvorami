<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Эскиз: грот у кремлёвской стены</title><desc id="d">Чертёж синькой: у подножия зубчатой стены — грот с аркадой, нарисован одним силуэтом, ось симметрии штрих-пунктиром, под ним размерная линия.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1"/></pattern>
