<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" role="img" aria-labelledby="t">
  <title id="t">Дворами — концепция C «Окно в синий час»</title>
  <rect width="360" height="110" rx="16" fill="#0E1630"/>
  <!-- Окно дома во дворе: три тёмных стекла и одно горящее -->
  <g transform="translate(26 25)">
    <rect x="0" y="0" width="60" height="60" rx="4" fill="#F3F1EA"/>
    <rect x="6" y="6" width="21" height="21" fill="#17224A"/>
    <rect x="33" y="6" width="21" height="21" fill="#FFC53D"/>
    <rect x="6" y="33" width="21" height="21" fill="#17224A"/>
    <rect x="33" y="33" width="21" height="21" fill="#17224A"/>
  </g>
  <text x="104" y="70" font-family="Unbounded, 'Arial Black', sans-serif" font-weight="800" font-size="40" letter-spacing="-0.5" fill="#F3F1EA">дворами</text>
</svg>
